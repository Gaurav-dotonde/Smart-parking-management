spring.application.name=parking-system

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Nisha@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
server.port=8080

# ---- JWT ----
jwt.secret=parkingSystemSuperSecretKeyForJWTTokenGeneration2026ChangeThisInProduction
jwt.expiration=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000

# ---- Booking lifecycle ----
parking.booking.early-checkin-minutes=15
parking.booking.no-show-grace-minutes=15
parking.booking.extension-reminder-minutes=15
parking.booking.extension-grace-minutes=15

# ---- First-run administrator (override with environment variables in production) ----
app.default-admin.name=${DEFAULT_ADMIN_NAME:Parking Administrator}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@gmail.com}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:Admin@123}