spring.application.name=parking-system

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Gaurav
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---- Server ----
server.port=8080

# ---- JWT ----
jwt.secret=parkingSystemSuperSecretKeyForJWTTokenGeneration2026ChangeThisInProduction
jwt.expiration=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000
