spring.application.name=parking-system

# Active Profile
spring.profiles.active=local

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Password application-local.properties se aayega
# Is line ko yahan se hata do:
# spring.datasource.password=Gaurav@123

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- JWT ----
jwt.expiration=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000

# ---- Booking lifecycle ----
parking.booking.early-checkin-minutes=15
parking.booking.no-show-grace-minutes=15
parking.booking.extension-reminder-minutes=15
parking.booking.extension-grace-minutes=15
